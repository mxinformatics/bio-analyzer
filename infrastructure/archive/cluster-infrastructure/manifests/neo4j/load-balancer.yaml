# Source: neo4j/templates/neo4j-loadbalancer.yaml
# Service for applications that need access to neo4j
apiVersion: v1
kind: Service
metadata:
  name: "neo4j-lb"
  namespace: "data-stores-dev"
  labels:
    helm.neo4j.com/neo4j.name: "neo4j-dev"
    app: "neo4j-dev"
    helm.neo4j.com/service: "neo4j"    
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: "LoadBalancer"
  
  externalTrafficPolicy: Local
  sessionAffinity: None
  ports:
    - protocol: TCP
      port: 7474
      targetPort: 7474
      name: http
    - protocol: TCP
      port: 7473
      targetPort: 7473
      name: https
    - protocol: TCP
      port: 7687
      targetPort: 7687
      name: tcp-bolt
    
    
  selector:
    app: "neo4j-dev"
    helm.neo4j.com/clustering: "false"
    helm.neo4j.com/neo4j.loadbalancer: include