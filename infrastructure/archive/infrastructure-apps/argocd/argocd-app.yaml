apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    notifications.argoproj.io/subscribe.on-sync.gitlab: ""
  name: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: cluster-infrastructure
  source:
    path: cluster-infrastructure/verida-prod/argocd/manifests
    repoURL: git@ssh.dev.azure.com:v3/setrans/Azure-Infrastructure/Azure-Infrastructure
    targetRevision: HEAD
  syncPolicy:
    automated: {}
