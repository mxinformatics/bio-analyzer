name: Build and Publish BioAnalyzer App

on:
  push:
    branches:
      - main
    paths:
      - 'src/BioAnalyzer/BioAnalyzer.App/**'
      - 'src/BioAnalyzer/BioAnalyzer.ServiceDefaults/**'
      - '.github/workflows/build-and-publish-app.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to use (default: latest)'
        required: false
        default: 'latest'

env:
  DOCKER_IMAGE: dmaxim/bioanalyzer-app
  REGISTRY: docker.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=raw,value=build-${{ github.run_number }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src/BioAnalyzer
        file: ./src/BioAnalyzer/BioAnalyzer.App/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Image digest
      if: github.event_name != 'pull_request'
      run: echo ${{ steps.build.outputs.digest }}