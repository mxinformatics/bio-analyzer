apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-creator-role
  namespace: bio
rules:
- apiGroups: [""] 
  resources: ["secrets"]
  verbs: ["create", "get", "list", "watch"] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-creator-role-binding
  namespace: bio
subjects:
- kind: ServiceAccount
  name: mi-bioanalyzer-poc
  namespace: bio
roleRef:
  kind: Role
  name: secret-creator-role
  apiGroup: rbac.authorization.k8s.io