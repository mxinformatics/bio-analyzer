# Default values for bioanalyzer-event-handlers
replicaCount: 1

image:
  repository: dmaxim/bioanalyzer-event-handlers
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "build-4"

imagePullSecrets: 
  - name: dm-docker

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "bioanalyzer"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false # Azure Functions needs to write temp files
  runAsNonRoot: true
  runAsUser: 1000

# Service configuration (optional, mainly for monitoring)
service:
  enabled: false
  type: ClusterIP
  port: 80

# Ingress is typically not needed for background event handlers
ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Liveness probe for Azure Functions
livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

# Readiness probe for Azure Functions
readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: tmp
    emptyDir: {}
  - name: lit-references
    emptyDir: {}

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: lit-references
    mountPath: /app/lit-references

nodeSelector: {}

tolerations: []

affinity: {}

# Azure Functions specific configuration
azureFunctions:
  # Azure Functions runtime configuration
  runtime:
    # Azure Functions runtime version
    version: "4"
    # Worker runtime
    workerRuntime: "dotnet-isolated"
  
  # Azure Functions host configuration
  host:
    # Enable detailed errors
    detailedErrors: true
    # Function timeout (in minutes)
    functionTimeout: 5


# Application Insights configuration
applicationInsights:
  # Enable Application Insights
  enabled: true
  # Connection string secret name
  connectionStringSecretName: ""
  connectionStringSecretKey: "connectionString"
  # Instrumentation key secret (alternative to connection string)
  instrumentationKeySecretName: ""
  instrumentationKeySecretKey: "instrumentationKey"

# Environment variables
env: 
  - name: LiteratureDownloadedTable
    value: "DownloadedLiterature"
  - name: DownloadDocumentQueue
    value: "download-document"
  - name: BuildDocumentListQueue
    value: "build-document-list"
  - name: DocumentDownloadedTopic
    value: "document-downloaded"
  - name: DocumentProcessingRequestedQueue
    value: "document-processing-requested"
  - name: ExtractDocumentTextQueue
    value: "extract-document-text"
  - name: TextExtractedTopic
    value: "text-extracted"
  - name: ProcessExtractedTextQueue
    value: "process-extracted-text"
  - name: DocumentGraphReadyTopic
    value: "document-graph-ready"
  - name: DocumentProcessingFailedTopic
    value: "document-processing-failed"
  - name: EventHandlerStorage__ProcessingStatusTableName
    value: "DocumentProcessingStatus"
  - name: DocumentProcessing__ChunkApiUrl
    value: "http://chunk-api:8001"
  - name: DocumentProcessing__EmbeddingApiUrl
    value: "http://embedding-api:8002"
  - name: DocumentProcessing__GraphDataApiUrl
    value: "http://graph-data-api:8080"
  - name: DocumentProcessing__ChunkApiKey
    value: ""
  - name: DocumentProcessing__EmbeddingApiKey
    value: ""
  - name: DocumentProcessing__GraphDataApiKey
    value: ""
# Environment variables from secrets
envFromSecrets: []
  # - secretName: azure-storage-secrets
  # - secretName: azure-servicebus-secrets
  # - secretName: application-insights-secrets

# Additional environment variables from config map
envFromConfigMap: []
  # - configMapName: app-config

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network policy
networkPolicy:
  enabled: false

# Monitoring and logging
monitoring:
  # Enable Prometheus metrics
  prometheus:
    enabled: false
    port: 9090
    path: /metrics
  
  # Structured logging configuration
  logging:
    level: "Information"
    enableConsoleLogging: true
    enableStructuredLogging: true